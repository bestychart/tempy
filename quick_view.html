        }
    }
    return url;
};

const MS_1M = 60 * 1000;
const MS_1H = 60 * MS_1M;
const MS_1D = 24 * MS_1H;
const MS_3D = 3 * MS_1D;
const MS_1W = 7 * MS_1D;
// Unix Epoch (1970-01-01 00:00:00 UTC) був четвергом. Зсув четверга відносно понеділка становить 3 дні.
const WEEK_EPOCH_OFFSET_MS = 3 * MS_1D;

function getCandleOpenTimeFloorMs(timestampMs, timeframe) {
    const numericMs = Number(timestampMs);
    if (!Number.isFinite(numericMs) || numericMs <= 0) return 0;
    if (!timeframe || typeof timeframe !== 'string') return numericMs;

    if (timeframe === '1M') {
        const d = new Date(numericMs);
        if (Number.isNaN(d.getTime())) return numericMs;
        return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1, 0, 0, 0, 0);
    }
    if (timeframe === '1w') {
        return Math.floor((numericMs + WEEK_EPOCH_OFFSET_MS) / MS_1W) * MS_1W - WEEK_EPOCH_OFFSET_MS;
    }
    if (timeframe === '3d') {
        return Math.floor(numericMs / MS_3D) * MS_3D;
    }
    if (timeframe === '1d') {
        return Math.floor(numericMs / MS_1D) * MS_1D;
    }

    const amount = Number.parseInt(timeframe, 10);
    if (!Number.isFinite(amount) || amount <= 0) return numericMs;

    let unitMs = 0;
    if (timeframe.endsWith('m')) unitMs = MS_1M;
    else if (timeframe.endsWith('h')) unitMs = MS_1H;

    if (unitMs > 0) {
        const intervalMs = amount * unitMs;
        return Math.floor(numericMs / intervalMs) * intervalMs;
    }
    return numericMs;
}

function getCandleCloseTimeMs(openTimeSeconds, timeframe) {
    const openTimeMs = Number(openTimeSeconds) * 1000;
    if (!Number.isFinite(openTimeMs) || openTimeMs < 0) return NaN;

    if (timeframe === '1M') {
        const openDate = new Date(openTimeMs);
        if (Number.isNaN(openDate.getTime())) return NaN;
        return Date.UTC(
            openDate.getUTCFullYear(),
            openDate.getUTCMonth() + 1,
            1,
            0,
            0,
            0,
            0
        );
    }

    const amount = Number.parseInt(timeframe, 10);
    if (!Number.isFinite(amount) || amount <= 0) return NaN;

    let unitMs = 0;
    if (timeframe.endsWith('m')) unitMs = 60 * 1000;
    else if (timeframe.endsWith('h')) unitMs = 60 * 60 * 1000;
    else if (timeframe.endsWith('d')) unitMs = 24 * 60 * 60 * 1000;
    else if (timeframe.endsWith('w')) unitMs = 7 * 24 * 60 * 60 * 1000;

    return unitMs > 0 ? openTimeMs + amount * unitMs : NaN;
}

function windowContainsCurrentOpenCandle(candles, timeframe, nowMs = Date.now()) {
    if (!Array.isArray(candles) || candles.length === 0 || !Number.isFinite(nowMs)) return false;
    const lastOpenTimeSeconds = Number(candles[candles.length - 1]?.time);
    const lastOpenTimeMs = lastOpenTimeSeconds * 1000;
    const lastCloseTimeMs = getCandleCloseTimeMs(lastOpenTimeSeconds, timeframe);
    return Number.isFinite(lastOpenTimeMs)
        && Number.isFinite(lastCloseTimeMs)
        && lastOpenTimeMs <= nowMs
        && nowMs < lastCloseTimeMs;
}

// === MATH HELPERS (Ті самі, без змін) ===
// 1. Універсальна функція WMA, яка напряму мутує об'єкти (O(1) складність після старту)
function applyWMA(candles, period, sourceKey, targetKey) {
    const n = candles.length;
    if (n < period) return;

    const weightSum = (period * (period + 1)) / 2;
    let currentTotalSum = 0;
    let currentWeightedSum = 0;

    // Шукаємо першу свічку, де є базові дані (для HMA це може бути не 0-й індекс)
    let validStartIndex = -1;
    for (let i = 0; i < n; i++) {
        if (candles[i][sourceKey] !== undefined && candles[i][sourceKey] !== null) {
            validStartIndex = i;
            break;
        }
    }

    if (validStartIndex === -1 || n - validStartIndex < period) return;

    // Розрахунок першого вікна
    for (let i = 0; i < period; i++) {
        const val = candles[validStartIndex + i][sourceKey];
        currentTotalSum += val;
        currentWeightedSum += val * (i + 1);
    }
    candles[validStartIndex + period - 1][targetKey] = currentWeightedSum / weightSum;

    // Швидкий прохід ковзним вікном для решти масиву
    for (let i = validStartIndex + period; i < n; i++) {
        const newPrice = candles[i][sourceKey];
        const oldPrice = candles[i - period][sourceKey];
        
        currentWeightedSum = currentWeightedSum - currentTotalSum + (newPrice * period);
        currentTotalSum = currentTotalSum - oldPrice + newPrice;
        
        candles[i][targetKey] = currentWeightedSum / weightSum;
    }
}

// 2. Функція HMA, яка генерує унікальні ключі для тимчасових даних
function applyHMA(candles, period, sourceKey, targetKey) {
    const nHalf = Math.floor(period / 2);
    const nSqrt = Math.floor(Math.sqrt(period));
    
    // Унікальні ключі, щоб дані HMA25 не затерли дані HMA100
    const keyHalf = `_wmaHalf_${period}`;
    const keyFull = `_wmaFull_${period}`;
    const keyDiff = `_hmaDiff_${period}`;

    // Мутуємо масив, додаючи тимчасові WMA
    applyWMA(candles, nHalf, sourceKey, keyHalf);
    applyWMA(candles, period, sourceKey, keyFull);

    // Рахуємо різницю
    for (let i = 0; i < candles.length; i++) {
        const valHalf = candles[i][keyHalf];
        const valFull = candles[i][keyFull];
        if (valHalf !== undefined && valFull !== undefined) {
            candles[i][keyDiff] = (2 * valHalf) - valFull;
        }
    }

    // Фінальний WMA лягає у targetKey (наприклад, 'hma25')
    applyWMA(candles, nSqrt, keyDiff, targetKey);
}

function applyDeviationCloud(candles, emaLength, basisMode) {
    if (candles.length < emaLength * 2) return;

    const stDevPeriod = emaLength * 2;
    const R1 = 0.92, R2 = 2.0, L4 = 3.8, L5 = 5.5, L6 = 6.0, L8 = 8.0;

    // 1. Рахуємо центральну лінію (EMA або VWAP)
    if (basisMode === 'vwap') {
        // VWAP: Cumulative (Price * Volume) / Cumulative Volume
        // Використовуємо rolling VWAP з вікном = emaLength для подібної "плавності"
        let cumPV = 0, cumVol = 0;
        for (let i = 0; i < candles.length; i++) {
            const c = candles[i];
            const typicalPrice = (c.high + c.low + c.close) / 3;
            const vol = c.volume || 0;
            cumPV += typicalPrice * vol;
            cumVol += vol;

            // Rolling window: віднімаємо старий елемент
            if (i >= emaLength) {
                const old = candles[i - emaLength];
                const oldTP = (old.high + old.low + old.close) / 3;
                cumPV -= oldTP * (old.volume || 0);
                cumVol -= (old.volume || 0);
            }

            c.threeEma = (cumVol > 0) ? (cumPV / cumVol) : c.close;
        }
    } else {
        // EMA (default)
        const k = 2 / (emaLength + 1);
        let currentEma = null;
        for (let i = 0; i < candles.length; i++) {
            const close = candles[i].close;
            if (currentEma === null) currentEma = close;
            else currentEma = (close - currentEma) * k + currentEma;
            candles[i].threeEma = currentEma;
        }
    }

    // 2. Рахуємо StDev (Ковзне вікно) та лінії
    let sum = 0, sumSq = 0;
    
    for (let i = 0; i < candles.length; i++) {
        const c = candles[i];
        sum += c.close;
        sumSq += c.close * c.close;

        if (i >= stDevPeriod) {
            const oldClose = candles[i - stDevPeriod].close;
            sum -= oldClose;
            sumSq -= oldClose * oldClose;
        }

        if (i >= stDevPeriod - 1) {
            const mean = sum / stDevPeriod;
            // Захист від похибок IEEE 754 float за допомогою Math.max(0, ...)
            const variance = Math.max(0, (sumSq / stDevPeriod) - (mean * mean));
            const stdev = Math.sqrt(variance);
            const cloudSize = stdev / 4;

            c.devCloudSize = cloudSize;

            if (cloudSize > 0) {
                const ema = c.threeEma;
                c.devL1 = ema - cloudSize * R1; c.devH1 = ema + cloudSize * R1;
                c.devL2 = ema - cloudSize * R2; c.devH2 = ema + cloudSize * R2;
                c.devL4 = ema - cloudSize * L4; c.devH4 = ema + cloudSize * L4;
                c.devL5 = ema - cloudSize * L5; c.devH5 = ema + cloudSize * L5;
                c.devL6 = ema - cloudSize * L6; c.devH6 = ema + cloudSize * L6;
                c.devL8 = ema - cloudSize * L8; c.devH8 = ema + cloudSize * L8;
            }
        }
    }
}

// One calculation contract for the two Bollinger envelopes. The independent BB2 window
// is prepared even while hidden, so switching the preset never waits for another candle.
function calculateBollingerWindow(candles, period, multiplier, prefix, startAt = 0) {
    if (!Array.isArray(candles)) return;
    period = Math.max(1, Math.floor(Number(period) || 20));
    multiplier = Number.isFinite(Number(multiplier)) ? Number(multiplier) : 2;
    const middleKey = prefix + 'Middle';
    const upperKey = prefix + 'Upper';
    const lowerKey = prefix + 'Lower';
    const first = Math.max(0, Math.floor(startAt), period - 1);
    // Full recalculation must not leave stale values from an earlier, shorter period.
    if (startAt === 0) {
        for (let i = 0; i < Math.min(period - 1, candles.length); i++) {
            delete candles[i][middleKey];
            delete candles[i][upperKey];
            delete candles[i][lowerKey];
        }
    }
    for (let i = first; i < candles.length; i++) {
        let sum = 0;
        for (let j = 0; j < period; j++) sum += candles[i - j].close;
        const mean = sum / period;
        let squaredDifferences = 0;
        for (let j = 0; j < period; j++) {
            const difference = candles[i - j].close - mean;
            squaredDifferences += difference * difference;
        }
        const deviation = Math.sqrt(Math.max(0, squaredDifferences / period));
        candles[i][middleKey] = mean;
        candles[i][upperKey] = mean + deviation * multiplier;
        candles[i][lowerKey] = mean - deviation * multiplier;
    }
}

// 3. Головна функція індикаторів (Параметризована через indicatorConfig)
function calculateIndicators(candles) {
    if (!candles || candles.length === 0) return candles;
    
    const cfg = indicatorConfig;
    const periodSMA = cfg.sma.length;

    // 1. Рахуємо прості індикатори за один прохід
    for (let i = 0; i < candles.length; i++) {
        // SMA
        if (i >= periodSMA - 1) {
            let sum = 0;
            for (let j = 0; j < periodSMA; j++) sum += candles[i - j].close;
            candles[i].sma7 = sum / periodSMA;
        }
        

    }

    calculateBollingerWindow(candles, cfg.bb.length, cfg.bb.multiplier, 'bb');
    calculateBollingerWindow(candles, cfg.bb2.length, cfg.bb2.multiplier, 'bb2');

    // 2. Рахуємо всі HMA з параметрами з конфігу
    applyHMA(candles, cfg.hma25.length, 'close', 'hma25');
    applyHMA(candles, cfg.hma35.length, 'close', 'hma35');
    applyHMA(candles, cfg.hma55.length, 'close', 'hma55');
    applyHMA(candles, 80, 'close', 'hma80');
    applyHMA(candles, cfg.hma100.length, 'close', 'hma100');

    // 3. Deviation Cloud з параметрами з конфігу
    applyDeviationCloud(candles, cfg.devCloud.emaLength, cfg.devCloud.basisMode);

    // 4. RSI
    calculateRSI(candles, cfg.rsi ? cfg.rsi.period : 14);

    return candles; // Повертаємо той самий мутований масив
}

function calculateRSI(candles, period = 9) {
    if (!Array.isArray(candles) || candles.length <= period) return;
    
    let avgGain = 0;
    let avgLoss = 0;
    
    for (let i = 1; i <= period; i++) {
        const diff = candles[i].close - candles[i - 1].close;
        if (diff > 0) {
            avgGain += diff;
        } else {
            avgLoss -= diff;
        }
    }
    
    avgGain /= period;
    avgLoss /= period;
    
    let rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
    candles[period].rsi = 100 - (100 / (1 + rs));
    
    for (let i = period + 1; i < candles.length; i++) {
        const diff = candles[i].close - candles[i - 1].close;
        let gain = 0;
        let loss = 0;
        if (diff > 0) {
            gain = diff;
        } else {
            loss = -diff;
        }
        
        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
        
        rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
        candles[i].rsi = 100 - (100 / (1 + rs));
    }

    // Розрахунок HMA на основі RSI
    applyHMA(candles, 60, 'rsi', 'rsi_hm50');
    applyHMA(candles, 36, 'rsi', 'rsi_hmLen2');
    applyHMA(candles, 22, 'rsi', 'rsi_hmLen3');

    // EMA(RSI, 9)
    applyEMA(candles, 9, 'rsi', 'rsi_sma_low');

    // SMA(RSI, 31)
    applySMA(candles, 31, 'rsi', 'rsi_sma');

    // Розрахунок Volume Oscillator
    applyVolumeOsc(candles);

    // Розрахунок стандартного відхилення та розміру тіла свічки (body)
    applyStdDev(candles, 100, 'close', '_close_stdev100');
    for (let i = 0; i < candles.length; i++) {
        const c = candles[i];
        const stdev = c._close_stdev100;
        if (stdev !== undefined && stdev !== null) {
            c.is_large_body = Math.abs(c.close - c.open) > stdev * 0.5 / 100;
        } else {
            c.is_large_body = false;
        }
    }
}

function applyEMA(candles, period, sourceKey, targetKey) {
    const n = candles.length;
    if (n === 0) return;
    let firstIdx = -1;
    for (let i = 0; i < n; i++) {
        if (candles[i][sourceKey] !== undefined && candles[i][sourceKey] !== null) {
            firstIdx = i;
            break;
        }
    }
    if (firstIdx === -1 || n - firstIdx < period) return;
    
    let sum = 0;
    for (let i = 0; i < period; i++) {
        sum += candles[firstIdx + i][sourceKey];
    }
    let currentEma = sum / period;
    candles[firstIdx + period - 1][targetKey] = currentEma;
    
    const k = 2 / (period + 1);
    for (let i = firstIdx + period; i < n; i++) {
        const val = candles[i][sourceKey];
        if (val !== undefined && val !== null) {
            currentEma = (val - currentEma) * k + currentEma;
            candles[i][targetKey] = currentEma;
        }
    }
}

function applySMA(candles, period, sourceKey, targetKey) {
    const n = candles.length;
    if (n === 0) return;
    let firstIdx = -1;
    for (let i = 0; i < n; i++) {
        if (candles[i][sourceKey] !== undefined && candles[i][sourceKey] !== null) {
            firstIdx = i;
            break;
        }
    }
    if (firstIdx === -1 || n - firstIdx < period) return;
    
    let sum = 0;
    for (let i = 0; i < period; i++) {
        sum += candles[firstIdx + i][sourceKey];
    }
    candles[firstIdx + period - 1][targetKey] = sum / period;
    
    for (let i = firstIdx + period; i < n; i++) {
        const newVal = candles[i][sourceKey];
        const oldVal = candles[i - period][sourceKey];
        if (newVal !== undefined && oldVal !== undefined) {
            sum = sum - oldVal + newVal;
            candles[i][targetKey] = sum / period;
        }
    }
}

function applyStdDev(candles, period, sourceKey, targetKey) {
    const n = candles.length;
    if (n < period) return;
    
    let sum = 0;
    let sumSq = 0;
    for (let i = 0; i < period; i++) {
        const val = candles[i][sourceKey];
        sum += val;
        sumSq += val * val;
    }
    
    let mean = sum / period;
    let variance = (sumSq / period) - (mean * mean);
    candles[period - 1][targetKey] = Math.sqrt(Math.max(0, variance));
    
    for (let i = period; i < n; i++) {
        const newVal = candles[i][sourceKey];
        const oldVal = candles[i - period][sourceKey];
        sum = sum - oldVal + newVal;
        sumSq = sumSq - (oldVal * oldVal) + (newVal * newVal);
        mean = sum / period;
        variance = (sumSq / period) - (mean * mean);
        candles[i][targetKey] = Math.sqrt(Math.max(0, variance));
    }
}

function applyVolumeOsc(candles) {
    const n = candles.length;
    if (n === 0) return;
    
    applySMA(candles, 50, 'volume', '_vol_sma50');
    applySMA(candles, 100, 'volume', '_vol_sma100');
    
    for (let i = 0; i < n; i++) {
        const c = candles[i];
        const vol = c.volume || 0;
        const sma50 = c._vol_sma50;
        const sma100 = c._vol_sma100;
        
        if (sma50 === undefined || sma100 === undefined || sma50 === 0 || sma100 === 0) {
            c.btc_out_vol = 5; 
            continue;
        }
        
        let oscSv = 0.5 * (50 * (vol - sma50) / sma50);
        if (oscSv > 72) oscSv = 72;
        const oscSvBTC = oscSv / 2;
        const volBTC = (oscSvBTC - 5) / 2 + 10;
        
        let volSt = 0;
        if (vol > sma100 && vol < sma100 * 2) {
            volSt = 7;
        } else if (vol > sma100 * 2 && vol < sma100 * 4) {
            volSt = 15;
        } else if (vol > sma100 * 4 && vol < sma100 * 8) {
            volSt = 27;
        } else if (vol > sma100 * 8) {
            volSt = 37;
        }
        
        let volPlot = 0;
        if (volBTC > 5) {
            volPlot = volBTC > volSt ? volBTC : volSt;
        } else {
            volPlot = 0;
        }
        
        c.btc_out_vol = volPlot;
    }
}

function getMondayTimestamp(ts) {
    const date = new Date(ts * 1000);
    const day = date.getUTCDay();
    const diff = date.getUTCDate() - day + (day === 0 ? -6 : 1);
    const monday = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), diff, 0, 0, 0));
    return Math.floor(monday.getTime() / 1000);
}

function aggregate1dTo1w(candles1d) {
    if (!Array.isArray(candles1d) || candles1d.length === 0) return [];
    
    const weeks = {};
    for (let i = 0; i < candles1d.length; i++) {
        const c = candles1d[i];
        const mondayTs = getMondayTimestamp(c.time);
        if (!weeks[mondayTs]) {
            weeks[mondayTs] = [];
        }
        weeks[mondayTs].push(c);
    }
    
    const aggregated = [];
    const sortedMondays = Object.keys(weeks).map(Number).sort((a, b) => a - b);
    
    for (let i = 0; i < sortedMondays.length; i++) {
        const mondayTs = sortedMondays[i];
        const weekCandles = weeks[mondayTs].sort((a, b) => a.time - b.time);
        
        const open = weekCandles[0].open;
        const close = weekCandles[weekCandles.length - 1].close;
        let high = weekCandles[0].high;
        let low = weekCandles[0].low;
        let volume = 0;
        
        for (let j = 0; j < weekCandles.length; j++) {
            high = Math.max(high, weekCandles[j].high);
            low = Math.min(low, weekCandles[j].low);
            volume += weekCandles[j].volume;
        }
        
        aggregated.push({
            time: mondayTs,
            open,
            high,
            low,
            close,
            volume
        });
    }
    return aggregated;
}

function mapCandleData(raw, market = 'SPOT') {
    if (market === 'BITSTAMP') {
        if (!raw || !Array.isArray(raw.ohlc)) return [];
        const ohlc = raw.ohlc;
        const result = [];
        for (let i = 0; i < ohlc.length; i++) {
            const d = ohlc[i];
            const time = parseInt(d.timestamp);
            const open = parseFloat(d.open);
            const high = parseFloat(d.high);
            const low = parseFloat(d.low);
            const close = parseFloat(d.close);
            const volume = parseFloat(d.volume);
            if (!isFinite(time) || !isFinite(open) || !isFinite(high) || !isFinite(low) || !isFinite(close) || !isFinite(volume)) continue;
            if (time <= 0 || open <= 0 || high <= 0 || low <= 0 || close <= 0) continue;
            result.push({ time, open, high, low, close, volume });
        }
        result.sort((a, b) => a.time - b.time);
        return result;
    }

    if (!Array.isArray(raw)) return [];
    const result = [];
    for (let i = 0; i < raw.length; i++) {
        const d = raw[i];
        if (!Array.isArray(d) || d.length < 6) continue;
        const time = d[0] / 1000;
        const open = parseFloat(d[1]);
        const high = parseFloat(d[2]);
        const low = parseFloat(d[3]);
        const close = parseFloat(d[4]);
        const volume = parseFloat(d[5]);
        // Валідація: пропускаємо свічки з NaN/Infinity
        if (!isFinite(time) || !isFinite(open) || !isFinite(high) || !isFinite(low) || !isFinite(close) || !isFinite(volume)) continue;
        if (time <= 0 || open <= 0 || high <= 0 || low <= 0 || close <= 0) continue;
        result.push({ time, open, high, low, close, volume });
    }
    result.sort((left, right) => left.time - right.time);
    return result;
}

// === MARKET LOGIC ===

// Допоміжна: витягти precision з PRICE_FILTER tickSize (для Spot)
function getPrecisionFromTickSize(filters) {
    if (!Array.isArray(filters)) return 8;
    const priceFilter = filters.find(f => f.filterType === 'PRICE_FILTER');
    if (!priceFilter || !priceFilter.tickSize) return 8;
    // tickSize: "0.01000000" → precision = 2
    const tickStr = priceFilter.tickSize;
    const dotIndex = tickStr.indexOf('.');
    if (dotIndex === -1) return 0;
    const decimals = tickStr.slice(dotIndex + 1);
    // Знаходимо позицію останньої значущої цифри (не '0')
    let precision = 0;
    for (let i = 0; i < decimals.length; i++) {
        if (decimals[i] !== '0') precision = i + 1;
    }
    return precision;
}

const ALPHA_QUOTE_PRIORITY = Object.freeze(['USDT', 'USDC']);

function extractAlphaExchangeSymbols(payload) {
    if (Array.isArray(payload?.data?.symbols)) return payload.data.symbols;
    if (Array.isArray(payload?.symbols)) return payload.symbols;
    return [];
}

function buildAlphaPairIndex(symbols) {
    const index = new Map();
    if (!Array.isArray(symbols)) return index;

    for (const raw of symbols) {
        const baseAsset = String(raw?.baseAsset || '').trim().toUpperCase();
        const quoteAsset = String(raw?.quoteAsset || '').trim().toUpperCase();
        if (!baseAsset || !ALPHA_QUOTE_PRIORITY.includes(quoteAsset)) continue;

        let byQuote = index.get(baseAsset);
        if (!byQuote) {
            byQuote = new Map();
            index.set(baseAsset, byQuote);
        }

        const normalized = {
            symbol: String(raw?.symbol || `${baseAsset}${quoteAsset}`).trim().toUpperCase(),
            baseAsset,
            quoteAsset,
            status: String(raw?.status || 'UNKNOWN').trim().toUpperCase() || 'UNKNOWN',
            pricePrecision: Number.isFinite(Number(raw?.pricePrecision)) ? Number(raw.pricePrecision) : null
        };

        const existing = byQuote.get(quoteAsset);
        if (!existing || (existing.status !== 'TRADING' && normalized.status === 'TRADING')) {
            byQuote.set(quoteAsset, normalized);
        }
    }
    return index;
}

function selectAlphaPair(pairIndex, alphaId) {
    const baseAsset = String(alphaId || '').trim().toUpperCase();
    if (!baseAsset) return null;
    const byQuote = pairIndex.get(baseAsset);
    if (!byQuote) return null;
    for (const quoteAsset of ALPHA_QUOTE_PRIORITY) {
        const pair = byQuote.get(quoteAsset);
        if (pair) return pair;
    }
    return null;
}

function normalizeAlphaListingTime(value) {
    const listingTime = Number(value);
    return Number.isFinite(listingTime) && listingTime > 0 ? listingTime : 0;
}

// Binance Alpha token-list can contain several generations of a token that reuse the same
// display ticker but have different alphaId values. Quick View identifies favorites and saved
// chart selections by the display ticker, so allowing duplicates here would make the selected
// alphaId depend on incidental API order. Collapse duplicates before any pair/status filtering:
// the generation with the latest listingTime is the canonical token for that ticker.
function deduplicateAlphaTokensByNewestListingTime(alphaList) {
    if (!Array.isArray(alphaList) || alphaList.length === 0) return [];

    const newestByTicker = new Map();
    for (const token of alphaList) {
        if (!token) continue;

        const ticker = String(token.symbol || '').trim().toUpperCase();
        const alphaId = String(token.alphaId || '').trim().toUpperCase();
        if (!ticker || !alphaId) continue;

        const listingTime = normalizeAlphaListingTime(token.listingTime);
        const current = newestByTicker.get(ticker);
        if (!current || listingTime > current.listingTime) {
            newestByTicker.set(ticker, { token, listingTime });
        }
        // Equal listingTime deliberately keeps the first API record. This makes the fallback
        // deterministic without inventing a secondary ordering that Binance did not define.
    }

    return Array.from(newestByTicker.values(), entry => entry.token);
}

function buildAlphaCoins(alphaList, alphaExchangeSymbols, now, exchangeInfoAvailable) {
    const pairIndex = buildAlphaPairIndex(alphaExchangeSymbols);
    const canonicalAlphaList = deduplicateAlphaTokensByNewestListingTime(alphaList);
    const result = [];

    for (const c of canonicalAlphaList) {
        if (!c) continue;

        const alphaId = String(c.alphaId || '').trim().toUpperCase();
        const displaySymbol = String(c.symbol || '').trim();
        if (!alphaId || !displaySymbol) continue;

        const selectedPair = selectAlphaPair(pairIndex, alphaId);
        if (exchangeInfoAvailable && !selectedPair) continue;

        // Старий token-list може позначати вже знятий токен як offline/cexOffDisplay.
        // DELISTED все одно залишаємо в Quick View для історичного перегляду та переходу до лістингу.
        // Для всіх інших прихованих token-list записів зберігаємо попередню поведінку.
        if ((c.cexOffDisplay || c.offline) && selectedPair?.status !== 'DELISTED') continue;

        const listingTime = Number(c.listingTime) || 0;
        const age = listingTime > 0 ? now - listingTime : Number.POSITIVE_INFINITY;
        let group = 2;
        if (listingTime > 0 && age < NEW_COIN_PERIOD_MS) group = 0;
        else if (listingTime > 0 && age < MID_COIN_PERIOD_MS) group = 1;

        const fallbackPairSymbol = `${alphaId}USDT`;
        const status = selectedPair?.status || 'UNKNOWN';
        const pairSymbol = selectedPair?.symbol || fallbackPairSymbol;
        const quoteAsset = selectedPair?.quoteAsset || 'USDT';

        result.push({
            symbol: displaySymbol,
            dispName: displaySymbol,
            alphaId,
            pairSymbol,
            quoteAsset,
            status,
            isDelisted: status === 'DELISTED',
            listingDate: listingTime,
            precision: (c.tradeDecimal !== undefined) ? c.tradeDecimal : 4,
            isNew: group === 0,
            isMid: group === 1,
            group
        });
    }

    return result.sort((a, b) => (a.group !== b.group) ? a.group - b.group : a.dispName.localeCompare(b.dispName));
}

// Допоміжна: побудувати coin-об'єкт для Futures/Spot з даних exchangeInfo
function buildExchangeInfoCoins(symbols, now, options) {
    const { quoteAsset, filterFn, getSymbol, getDispName, getPrecision, getListingTime } = options;
    
    return symbols
        .filter(s => {
            if (s.status !== 'TRADING') return false;
            if (quoteAsset && s.quoteAsset !== quoteAsset) return false;
            if (filterFn && !filterFn(s)) return false;
            return true;
        })
        .map(s => {
            const listingTime = getListingTime(s);
            const age = now - listingTime;
            let group = 2; // OLD за замовчуванням
            if (listingTime > 0 && age < NEW_COIN_PERIOD_MS) group = 0;
            else if (listingTime > 0 && age < MID_COIN_PERIOD_MS) group = 1;
            return {
                symbol: getSymbol(s),
                dispName: getDispName(s),
                alphaId: null,
                listingDate: listingTime,
                precision: getPrecision(s),
                isNew: group === 0,
                isMid: group === 1,
                group: group
            };
        })
        .sort((a, b) => (a.group !== b.group) ? a.group - b.group : a.dispName.localeCompare(b.dispName));
}

async function fetchAllMarkets() {
    try {
        const now = Date.now();

        // === Паралельне завантаження всіх ринків ===
        const [alphaResult, alphaExchangeInfoResult, futuresResult, spotResult, bitstampResult] = await Promise.allSettled([
            // ALPHA token metadata
            fetchWithTimeout(ENDPOINTS.ALPHA_LIST, {}, 12000).then(r => r.json()),
            // ALPHA tradable pair metadata (USDT preferred, USDC fallback)
            fetchWithTimeout(ENDPOINTS.ALPHA_EXCHANGE_INFO, {}, 12000).then(r => r.json()),
            // FUTURES
            fetchWithTimeout(ENDPOINTS.FUTURES_INFO, {}, 12000).then(r => r.json()),
            // SPOT
            fetchWithTimeout(ENDPOINTS.SPOT_INFO, {}, 12000).then(r => r.json()),
            // BITSTAMP
            fetchWithTimeout("https://www.bitstamp.net/api/v2/markets/", {}, 12000).then(r => r.json())
        ]);

        // --- ALPHA ---
        if (alphaResult.status === 'fulfilled') {
            const alphaList = Array.isArray(alphaResult.value?.data) ? alphaResult.value.data : [];
            const alphaExchangeSymbols = alphaExchangeInfoResult.status === 'fulfilled'
                ? extractAlphaExchangeSymbols(alphaExchangeInfoResult.value)
                : [];
            const exchangeInfoAvailable = alphaExchangeSymbols.length > 0;

            marketLists.ALPHA = buildAlphaCoins(alphaList, alphaExchangeSymbols, now, exchangeInfoAvailable);

            if (!exchangeInfoAvailable) {
                console.warn('ALPHA exchange-info unavailable; falling back to legacy USDT mapping with UNKNOWN status.');
            }
        } else {
            console.error('Failed to load ALPHA market:', alphaResult.reason);
        }
        if (alphaExchangeInfoResult.status === 'rejected') {
            console.warn('Failed to load ALPHA exchange-info:', alphaExchangeInfoResult.reason);
        }

        // --- FUTURES ---
        if (futuresResult.status === 'fulfilled') {
            const futuresData = futuresResult.value;
            marketLists.FUTURES = buildExchangeInfoCoins(futuresData.symbols || [], now, {
                quoteAsset: 'USDT',
                filterFn: (s) => s.contractType === 'PERPETUAL',
                getSymbol: (s) => s.symbol,
                getDispName: (s) => s.baseAsset,
                getPrecision: (s) => s.pricePrecision || 4,
                getListingTime: (s) => s.onboardDate || 0
            });
        } else {
            console.error('Failed to load FUTURES market:', futuresResult.reason);
        }

        // --- SPOT ---
        if (spotResult.status === 'fulfilled') {
            const spotData = spotResult.value;
            marketLists.SPOT = buildExchangeInfoCoins(spotData.symbols || [], now, {
                quoteAsset: 'USDT',
                filterFn: (s) => s.isSpotTradingAllowed === true,
                getSymbol: (s) => s.symbol,
                getDispName: (s) => s.baseAsset,
                getPrecision: (s) => getPrecisionFromTickSize(s.filters),
                // Spot не має onboardDate — ставимо 0 (усі будуть group=2 "OLD")
                getListingTime: (s) => 0
            });
        } else {
            console.error('Failed to load SPOT market:', spotResult.reason);
        }

        // --- BITSTAMP ---
        if (bitstampResult.status === 'fulfilled') {
            const bitstampData = bitstampResult.value || [];
            marketLists.BITSTAMP = bitstampData
                .filter(m => m.trading === 'Enabled' && m.counter_currency === 'USD')
                .map(m => ({
                    symbol: m.market_symbol,
                    dispName: m.base_currency,
                    alphaId: null,
                    listingDate: 0,
                    precision: m.counter_decimals,
                    isNew: false,
                    isMid: false,
                    group: 2
                }))
                .sort((a, b) => a.dispName.localeCompare(b.dispName));
        } else {
            console.error('Failed to load BITSTAMP market:', bitstampResult.reason);
        }

        // Вважаємо завантаженим, якщо хоча б один ринок завантажився
        const anyLoaded = marketLists.ALPHA.length > 0 || marketLists.FUTURES.length > 0 || marketLists.SPOT.length > 0 || marketLists.BITSTAMP.length > 0;
        if (anyLoaded) {
            areMarketsLoaded = true;
            self.postMessage({ type: 'COINS_LISTS', data: marketLists });
        } else {
            // Жоден ринок не завантажився — повторюємо через 10с
            console.error('No markets loaded, retrying in 10s...');
            setTimeout(fetchAllMarkets, 10000);
        }
    } catch (e) {
        console.error('Fetch Markets Error:', e);
        setTimeout(fetchAllMarkets, 10000);
    }
}

const resolvedHistoryStartBySymbol = new Map();

function normalizeInitialLoadMode(value) {
    return value === 'listing' ? 'listing' : 'latest';
}

function normalizeLoadRequestId(value) {
    const numeric = Number(value);
    return Number.isFinite(numeric) ? numeric : 0;
}

function rememberLatestLoadIntent(payload = {}) {
    const chartId = Number(payload.chartId);
    const intent = {
        chartId,
        market: payload.market,
        symbol: payload.symbol,
        timeframe: payload.timeframe,
        requestId: normalizeLoadRequestId(payload.requestId),
        initialLoadMode: normalizeInitialLoadMode(payload.initialLoadMode)
    };

    latestLoadIntents[chartId] = intent;
    clearPendingMarketLoadRetry(chartId);
    return intent;
}

function isLatestLoadIntent(chartId, market, symbol, timeframe, requestId, initialLoadMode) {
    const current = latestLoadIntents[Number(chartId)];
    return Boolean(current)
        && current.market === market
        && current.symbol === symbol
        && current.timeframe === timeframe
        && current.requestId === normalizeLoadRequestId(requestId)
        && current.initialLoadMode === normalizeInitialLoadMode(initialLoadMode);
}

function clearPendingMarketLoadRetry(chartId) {
    const normalizedChartId = Number(chartId);
    const timerId = pendingMarketLoadTimers[normalizedChartId];
    if (timerId !== undefined) {
        clearTimeout(timerId);
        delete pendingMarketLoadTimers[normalizedChartId];
    }
}

function scheduleMarketReadyLoadRetry(chartId, market, symbol, timeframe, requestId, initialLoadMode) {
    if (!isLatestLoadIntent(chartId, market, symbol, timeframe, requestId, initialLoadMode)) return;

    clearPendingMarketLoadRetry(chartId);
    const normalizedChartId = Number(chartId);
    pendingMarketLoadTimers[normalizedChartId] = setTimeout(() => {
        delete pendingMarketLoadTimers[normalizedChartId];
        if (!isLatestLoadIntent(chartId, market, symbol, timeframe, requestId, initialLoadMode)) return;
        void fetchCandles(chartId, market, symbol, timeframe, requestId, initialLoadMode);
    }, MARKET_READY_RETRY_DELAY_MS);
}

function getHistoryStartCacheKey(market, symbol, timeframe) {
    return `${market}:${symbol}:${timeframe}`;
}

function rememberResolvedHistoryStart(market, symbol, timeframe, candles, coin = null) {
    if (!Array.isArray(candles) || candles.length === 0) return 0;
    const firstTimeSeconds = Number(candles[0]?.time);
    if (!Number.isFinite(firstTimeSeconds) || firstTimeSeconds <= 0) return 0;
    const firstTimeMs = Math.floor(firstTimeSeconds * 1000);
    resolvedHistoryStartBySymbol.set(getHistoryStartCacheKey(market, symbol, timeframe), firstTimeMs);
    if (coin && (!coin.listingDate || Number(coin.listingDate) <= 0)) {
        coin.listingDate = firstTimeMs;
    }
    return firstTimeMs;
}

function getResolvedHistoryStart(market, symbol, timeframe, coin) {
    const cached = Number(resolvedHistoryStartBySymbol.get(getHistoryStartCacheKey(market, symbol, timeframe))) || 0;
    if (cached > 0) return cached;
    const listed = Number(coin?.listingDate) || 0;
    if (listed > 0) {
        return getCandleOpenTimeFloorMs(listed, timeframe);
    }
    return 0;
}

async function fetchCandles(chartId, market, symbol, timeframe, requestId = 0, initialLoadMode = 'latest') {
    const normalizedLoadMode = normalizeInitialLoadMode(initialLoadMode);
    const numericRequestId = normalizeLoadRequestId(requestId);

    // Старий retry не має права скасовувати або замінювати новіший LOAD_CHART.
    if (!isLatestLoadIntent(chartId, market, symbol, timeframe, numericRequestId, normalizedLoadMode)) return;

    if (!areMarketsLoaded) {
        scheduleMarketReadyLoadRetry(
            chartId,
            market,
            symbol,
            timeframe,
            numericRequestId,
            normalizedLoadMode
        );
        return;
    }

    clearPendingMarketLoadRetry(chartId);
    if (!isLatestLoadIntent(chartId, market, symbol, timeframe, numericRequestId, normalizedLoadMode)) return;

    const coinList = marketLists[market];
    const coin = coinList ? coinList.find(c => c.symbol === symbol) : null;
    
    if (!coin) {
        self.postMessage({ type: 'DATA_ERROR', chartId, symbol, market, timeframe, requestId, reason: 'Symbol not found' });
        return;
    }

    if (market === 'BITSTAMP' && !['1m', '3m', '5m', '15m', '30m', '1h', '2h', '4h', '6h', '12h', '1d', '3d', '1w'].includes(timeframe)) {
        self.postMessage({ type: 'DATA_ERROR', chartId, symbol, market, timeframe, requestId, reason: `Bitstamp does not support ${timeframe} timeframe` });
        return;
    }

    const isCurrentLoad = () => {
        const current = activeSubs[chartId];
        return isLatestLoadIntent(
                chartId,
                market,
                symbol,
                timeframe,
                numericRequestId,
                normalizedLoadMode
            )
            && current
            && current.market === market
            && current.symbol === symbol
            && current.timeframe === timeframe
            && current.loadRequestId === numericRequestId
            && current.initialLoadMode === normalizedLoadMode;
    };

    // Перевіряємо намір ще раз безпосередньо перед транзакційною заміною підписки.
    if (!isLatestLoadIntent(chartId, market, symbol, timeframe, numericRequestId, normalizedLoadMode)) return;

    if (activeSubs[chartId] && activeSubs[chartId].controller) {
        activeSubs[chartId].controller.abort();
    }
    if (activeSubs[chartId] && activeSubs[chartId].historyController) {
        activeSubs[chartId].historyController.abort();
    }
    const controller = new AbortController();

    activeSubs[chartId] = { 
        market,
        symbol, 
        timeframe, 
        precision: coin.precision, 
        alphaId: coin.alphaId,
        alphaPairSymbol: coin.pairSymbol || null,
        alphaStatus: String(coin.status || 'UNKNOWN').toUpperCase(),
        realtimeEnabled: coin.isDelisted !== true,
        buffer: [],
        isLoading: true,
        controller,
        historyController: null,
        historyRequestId: 0,
        loadRequestId: numericRequestId,
        subscriptionEpoch: nextSubscriptionEpoch++,
        initialLoadMode: normalizedLoadMode,
        historyMode: normalizedLoadMode === 'listing',
        realtimeIntervalMs: getRealtimeIntervalMs(chartId),
        nextRealtimeAt: Date.now() + getRealtimeIntervalMs(chartId)
    };

    const commitInitialWindow = (rawCandles) => {
        if (!isCurrentLoad()) return false;
        const current = activeSubs[chartId];
        const candles = Array.isArray(rawCandles) ? rawCandles : [];
        if (candles.length === 0) {
            current.isLoading = false;
            return false;
        }

        const resolvedHistoryStart = normalizedLoadMode === 'listing'
            ? (rememberResolvedHistoryStart(market, symbol, timeframe, candles, coin)
                || getResolvedHistoryStart(market, symbol, timeframe, coin))
            : getResolvedHistoryStart(market, symbol, timeframe, coin);
        const containsCurrentOpenCandle = windowContainsCurrentOpenCandle(candles, timeframe);
        const historyMode = normalizedLoadMode === 'listing' && !containsCurrentOpenCandle;
        const enriched = calculateIndicators(candles);

        current.buffer = candles;
        current.isLoading = false;
        current.historyMode = historyMode;
        incrementalState[chartId] = null;
        if (!historyMode && current.realtimeEnabled !== false) markSubscriptionRealtimeReady(chartId, current);

        self.postMessage({
            type: 'CANDLES_DATA',
            chartId,
            data: enriched,
            precision: coin.precision,
            symbol,
            market,
            timeframe,
            requestId: numericRequestId,
            loadRequestId: numericRequestId,
            subscriptionEpoch: current.subscriptionEpoch,
            initialLoadMode: normalizedLoadMode,
            reachedHistoryStart: normalizedLoadMode === 'listing',
            containsCurrentOpenCandle,
            historyMode,
            realtimeReady: !historyMode && current.realtimeEnabled !== false,
            historyStartTime: resolvedHistoryStart
        });
        return true;
    };

    // Bitstamp 1w uses a local historical file and a live 1d tail.
    if (market === 'BITSTAMP' && timeframe === '1w') {
        try {
            const jsonUrl = `${symbol.toLowerCase()}_1w.json`;
            let localData = [];
            try {
                localData = await fetchWithTimeout(jsonUrl, { signal: controller.signal }, 5000).then(r => r.json());
            } catch (err) {
                if (err.name === 'AbortError') return;
                localData = [];
            }
            
            if (localData.length === 0) {
                self.postMessage({ type: 'DATA_ERROR', chartId, symbol, market, timeframe, requestId: numericRequestId, reason: 'Failed to load weekly history JSON. Please run the Python aggregation script.' });
                if (isCurrentLoad()) activeSubs[chartId].isLoading = false;
                return;
            }
            
            const lastJsonCandle = localData[localData.length - 1];
            const lastJsonTime = lastJsonCandle.time;
            const startFetchTimeMs = (lastJsonTime - 86400) * 1000;
            const tailUrl = getKlinesUrl(market, symbol, '1d', 1000, null, startFetchTimeMs);
            const tailRes = await fetchWithTimeout(tailUrl, { signal: controller.signal }, 8000).then(r => r.json());
            if (!isCurrentLoad()) return;
            
            const rawTail = tailRes.data || tailRes;
            const tail1d = mapCandleData(rawTail, market);
            const tail1w = aggregate1dTo1w(tail1d);
            let merged;
            if (tail1w.length > 0) {
                const firstTailTime = tail1w[0].time;
                const historyClean = localData.filter(c => c.time < firstTailTime);
                merged = historyClean.concat(tail1w);
            } else {
                merged = localData;
            }
            merged = merged
                .filter(candle => Number.isFinite(Number(candle?.time)))
                .sort((left, right) => Number(left.time) - Number(right.time));

            const selectedWindow = normalizedLoadMode === 'listing'
                ? merged.slice(0, 1000)
                : merged;
            commitInitialWindow(selectedWindow);
            return;
        } catch (err) {
            if (err.name === 'AbortError') return;
            self.postMessage({ type: 'DATA_ERROR', chartId, symbol, market, timeframe, requestId: numericRequestId, reason: 'Error loading weekly data' });
            if (isCurrentLoad()) activeSubs[chartId].isLoading = false;
            return;
        }
    }

    const knownHistoryStart = getResolvedHistoryStart(market, symbol, timeframe, coin);
    const initialStartTime = normalizedLoadMode === 'listing'
        ? (knownHistoryStart > 0 ? knownHistoryStart : 0)
        : null;
    const url = getKlinesUrl(market, symbol, timeframe, 1000, coin.alphaId, initialStartTime, null, coin.pairSymbol);

    try {
        const res = await fetchWithTimeout(url, { signal: controller.signal }, 10000).then(r => r.json());
        if (!isCurrentLoad()) return;

        const raw = res.data || res;
        const mapped = mapCandleData(raw, market)
            .filter(candle => Number.isFinite(Number(candle?.time)))
            .sort((left, right) => Number(left.time) - Number(right.time));
        const data = [];
        for (const candle of mapped) {
            if (data.length > 0 && Number(data[data.length - 1].time) === Number(candle.time)) {
                data[data.length - 1] = candle;
            } else {
                data.push(candle);
            }
        }

        if (data.length === 0) {
            if (isCurrentLoad()) activeSubs[chartId].isLoading = false;
            self.postMessage({
                type: 'DATA_ERROR', chartId, symbol, market, timeframe,
                requestId: numericRequestId,
                reason: normalizedLoadMode === 'listing' ? 'No candles found from listing start' : 'No candle data'
            });
            return;
        }

        commitInitialWindow(data);
    } catch (error) {
        if (error.name === 'AbortError') return;
        self.postMessage({ type: 'DATA_ERROR', chartId, symbol, market, timeframe, requestId: numericRequestId, reason: 'Network Error' });
        if (isCurrentLoad()) activeSubs[chartId].isLoading = false;
    }
}

// Допоміжна функція для мікро-затримок (Jitter)
const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

async function runRealtimeLoop() {
    if (isPolling) return;
    isPolling = true;

    const loop = async () => {
        try {
            const now = Date.now();
            const targets = [];
            // Беремо тільки активні, не завантажувані (динамічно по всіх графіках)
            Object.keys(activeSubs).forEach(id => {
                const sub = activeSubs[id];
                if (
                    sub
                    && sub.symbol
                    && !sub.isLoading
                    && !sub.historyMode
                    && sub.realtimeEnabled !== false
                    && now >= (Number.isFinite(sub.nextRealtimeAt) ? sub.nextRealtimeAt : 0)
                ) {
                    targets.push({
                        id: parseInt(id),
                        subRef: sub,
                        market: sub.market,
                        symbol: sub.symbol,
                        timeframe: sub.timeframe,

                                    calculateBollingerWindow(sliceData, cfg.bb2.length, cfg.bb2.multiplier, 'bb2', sliceData.length - 10);

                                    applyHMA(sliceData, cfg.hma35.length, 'close', 'hma35');

            reachedHistoryStart: false,

            .filter(candle => {

        const previousLast = Number(previousLastTime);

            intent.timeframe,

        const chartId = Number(payload?.chartId);
        const requestId = Number(payload?.requestId);
        const chartGeneration = Number(payload?.chartGeneration);
        const enabled = payload?.enabled === true;
        const sub = activeSubs[chartId];
        const identityMatches = Boolean(sub)
            && sub.market === payload?.market
            && sub.symbol === payload?.symbol
            && sub.timeframe === payload?.timeframe;
        const generationMatches = identityMatches
            && Number.isFinite(chartGeneration)
            && sub.loadRequestId === chartGeneration;
        const accepted = identityMatches && generationMatches;

        if (accepted) {
            sub.historyMode = enabled;
            if (!sub.historyMode && sub.historyController) {
                sub.historyController.abort();
                sub.historyController = null;
                sub.historyRequestId += 1;
            }

            market: payload?.market,
            symbol: payload?.symbol,
            timeframe: payload?.timeframe,
            chartGeneration,
            requestId: Number.isFinite(requestId) ? requestId : 0,

    }

        } catch (error) {

        }
        return;
    }

        } catch (error) {
            postQuickViewTursoRequestResult(payload?.requestId, false, null, error);
        }
        return;

            postQuickViewTursoRequestResult(payload?.requestId, true, result);
        } catch (error) {
            postQuickViewTursoRequestResult(payload?.requestId, false, null, error);
        }
        return;
    }
    if (type === 'UPDATE_REALTIME_INTERVALS') {
        applyRealtimeIntervals(payload?.intervals || {}, true);
    }
    if (type === 'UPDATE_INDICATOR_CONFIG') {
        if (payload) {
            Object.assign(indicatorConfig, payload);
        }
        Object.keys(activeSubs).forEach(idStr => {
            const id = parseInt(idStr);
            const sub = activeSubs[id];
            if (!sub || !sub.buffer || sub.buffer.length === 0) return;
            incrementalState[id] = null;
            const enriched = calculateIndicators(sub.buffer);
            self.postMessage({
                type: 'CANDLES_DATA',
                chartId: id,
                data: enriched,
                precision: sub.precision,
                symbol: sub.symbol,
                market: sub.market,
                timeframe: sub.timeframe,
                scope: 'indicator_recalculate'
            });
        });
    }
